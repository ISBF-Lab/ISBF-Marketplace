name: ISBF Marketplace plugin tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: marketplace-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  discourse:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@main
    with:
      name: isbf-marketplace
      core_ref: 10004ccf5090d85f80da529aeb4ecb4f3b7b1205
      skip_linting: true
      skip_annotations: true
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: find . -name '*.rb' -not -path './.git/*' -print0 | xargs -0 -n1 ruby -c
      - run: bash -n deploy/install-plugin.sh
